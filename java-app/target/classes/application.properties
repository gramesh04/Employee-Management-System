# ═════════════════════════════════════════════════════════════════════
# Spring Boot Application Configuration
# ═════════════════════════════════════════════════════════════════════
# This file configures Spring Boot application behavior
# Loaded automatically by Spring Boot on startup

# ═════════════════════════════════════════════════════════════════════
# 1. SERVER CONFIGURATION
# ═════════════════════════════════════════════════════════════════════

# Server port
server.port=8080

# Server context path
server.servlet.context-path=/

# Shutdown gracefully
server.shutdown=graceful

# ═════════════════════════════════════════════════════════════════════
# 2. DATABASE CONFIGURATION (LOCAL DEVELOPMENT)
# Change these when connecting to AWS RDS!
# ═════════════════════════════════════════════════════════════════════

# Database URL
# LOCAL: jdbc:mysql://localhost:3306/employee_db
# AWS RDS: jdbc:mysql://your-rds-endpoint:3306/employee_db
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=root

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ═════════════════════════════════════════════════════════════════════
# 3. JPA / HIBERNATE CONFIGURATION
# ═════════════════════════════════════════════════════════════════════

# Hibernate dialect for MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# DDL Auto strategy
# update: Hibernate will update schema if needed (GOOD for development)
# validate: Only validate schema matches entities (GOOD for production)
# create-drop: Drop and recreate on startup (GOOD for testing)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=false

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Use SQL comments
spring.jpa.properties.hibernate.use_sql_comments=true

# Connection release mode
spring.jpa.properties.hibernate.connection.release_mode=on_close

# ═════════════════════════════════════════════════════════════════════
# 4. LOGGING CONFIGURATION
# ═════════════════════════════════════════════════════════════════════

# Root logger level
logging.level.root=INFO

# Spring Boot logger
logging.level.org.springframework.boot=INFO

# Spring Web logger
logging.level.org.springframework.web=INFO

# Hibernate logger
logging.level.org.hibernate=INFO

# Application logger
logging.level.com.example.webapp=DEBUG

# Database logger
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log file configuration
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# Log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ═════════════════════════════════════════════════════════════════════
# 5. JACKSON CONFIGURATION (JSON)
# ═════════════════════════════════════════════════════════════════════

# Date format
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Pretty print JSON
spring.jackson.serialization.indent-output=true

# ═════════════════════════════════════════════════════════════════════
# 6. APPLICATION PROPERTIES (CUSTOM)
# ═════════════════════════════════════════════════════════════════════

# Application name
app.name=Employee Management System
app.version=1.0.0
app.description=3-Tier Architecture REST API

# ═════════════════════════════════════════════════════════════════════
# SWITCHING TO AWS RDS (DEPLOYMENT)
# ═════════════════════════════════════════════════════════════════════
# When deploying to AWS, change database properties:
# 
# spring.datasource.url=jdbc:mysql://employee-db.c0qw123abc.us-east-1.rds.amazonaws.com:3306/employee_db
# spring.datasource.username=admin
# spring.datasource.password=${DB_PASSWORD}
# 
# Use environment variables for sensitive data!
# ═════════════════════════════════════════════════════════════════════
